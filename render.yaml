services:
  - type: web
    name: sahayu-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false          # Supplied in Render Environment Variables tab
      - key: SECRET_KEY
        sync: false          # Supplied in Render Environment Variables tab
      - key: APP_TITLE
        value: "Cooperative Gig Services API"
      - key: APP_VERSION
        value: "1.0.0"
      - key: ENVIRONMENT
        value: "production"
      - key: ALLOWED_ORIGINS
        sync: false          # Optional: Add frontend URLs e.g. https://sahayu.vercel.app
