services:
  - type: web
    name: sahayu-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false          # Set manually in Render dashboard — paste your Supabase/Render PostgreSQL URL
      - key: SECRET_KEY
        generateValue: true  # Render auto-generates a strong random secret
      - key: APP_TITLE
        value: "Cooperative Gig Services API"
      - key: APP_VERSION
        value: "1.0.0"
      - key: ENVIRONMENT
        value: "production"
      - key: ALLOWED_ORIGINS
        sync: false          # Set to your frontend URL e.g. https://yourapp.vercel.app
